# Type check and both suites run against real FFI. They need `mod.ts`,
# `test/` and the `deno.json` tasks that point at them; until the source
# lands, the lint/check/test steps have nothing to work on and will fail.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # ubuntu-24.04 is pinned rather than ubuntu-latest because the whole test
    # run depends on a specific system libsqlite3, and "latest" silently
    # changing its distro would change that library underneath us.
    #
    # macOS/arm64 is not in the matrix yet. What it would need: Apple's
    # /usr/lib/libsqlite3.dylib lives only in the dyld shared cache and is
    # built WITHOUT SQLITE_ENABLE_PREUPDATE_HOOK, so the preupdate tests
    # cannot run against it. A macOS leg therefore has to `brew install
    # sqlite` and point DENO_SQLITE_PATH at
    # /opt/homebrew/opt/sqlite/lib/libsqlite3.dylib (Intel runners:
    # /usr/local/opt/sqlite/lib/libsqlite3.dylib) — and Homebrew's build also
    # omits the preupdate hook, so a fully green macOS leg needs a SQLite
    # amalgamation compiled here with -DSQLITE_ENABLE_PREUPDATE_HOOK. Same for
    # Windows, plus a .dll and a different loader path.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    # ONLY A PRECONDITION MAY GATE A LATER STEP. A failed step skips every
    # later one by default, so a subordinate check placed ahead of the primary
    # ones costs all the coverage behind it and still reports as a single red
    # step — which reads as a small problem while being a total one. Four
    # steps are preconditions in the strict sense, because if any of them
    # fails nothing downstream can mean anything: checkout, setup-deno,
    # "Install libsqlite3" and "Pin DENO_SQLITE_PATH". Every other step
    # carries `if: "!cancelled()"` and runs regardless — including "Tests",
    # "Crash matrix" and "Publish manifest" themselves, since a Tests failure
    # hiding a Publish manifest failure is the same defect in miniature.
    #
    # `!cancelled()` rather than `always()`: a run someone cancelled should
    # stop, not grind through every remaining step.
    #
    # test/ci_workflow.ts holds this. It is not a convention; an invariant
    # whose only expression is "four steps happen to lack a line of YAML" is
    # one pull request away from being violated by a new step.
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Before any library is installed, and deliberately so: this asks only
      # whether `Capabilities`, the capability table's row list and the
      # committed README block still agree with one another, and it opens
      # nothing. Running it first means it still reports on a runner where
      # installing libsqlite3 fails — and a structural mismatch is reported as
      # itself rather than buried under an environment failure it has nothing
      # to do with.
      - name: Capability table structure
        if: "!cancelled()"
        run: deno task test:table-structure

      # Whether any step in this job can suppress any other. Opens no library
      # either, so it reports on a runner where the install fails.
      - name: CI step guards
        if: "!cancelled()"
        run: deno task test:ci-guards

      # Whether the formatter has wrapped a code span across a newline in any
      # tracked Markdown, which leaves the literal inside it un-greppable and
      # silently stops the span being a citation. Placed here, before the
      # library, for the same measured reason as the two steps above: it opens
      # no library and needs no FFI. Its one child process is `git ls-files`,
      # which is how it learns which documents to read rather than being told
      # by a hand-maintained list -- so it needs the checkout and nothing else.
      # A shallow checkout is enough: the index lists every tracked path at
      # depth 1.
      - name: Wrapped code spans in the documents
        if: "!cancelled()"
        run: deno task test:docs-literals

      # Ubuntu 24.04 ships SQLite 3.45.x built with SQLITE_ENABLE_PREUPDATE_HOOK
      # (verified: the sqlite3_preupdate_* symbols are exported from
      # libsqlite3.so.0). libsqlite3-0 is normally already present; installing
      # it explicitly makes the dependency visible instead of incidental.
      - name: Install libsqlite3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-0

      # One library, chosen here, used by BOTH the vendored driver in driver/
      # and our own dlopen. The driver reads DENO_SQLITE_PATH once at import
      # time and otherwise falls back to the build in vendor/lib/; it
      # downloads nothing, and has not since the driver was vendored. If the
      # two halves open different files the sqlite3* handle we borrow belongs
      # to a foreign build and the process dies of SIGSEGV — exit 139, no
      # stack, no message. Setting it in GITHUB_ENV makes every later step in
      # this job inherit the same value.
      - name: Pin DENO_SQLITE_PATH
        run: |
          set -euo pipefail
          LIB=/usr/lib/x86_64-linux-gnu/libsqlite3.so.0
          test -f "$LIB" || { echo "::error::no libsqlite3 at $LIB"; exit 1; }
          echo "DENO_SQLITE_PATH=$LIB" >> "$GITHUB_ENV"
          echo "using $LIB"

      # The hooks this library exists to expose have to actually be in the
      # library we just pinned. A missing symbol is a build-flag problem, and
      # it is far better to say so here than to have a test fail obscurely.
      - name: Verify the library exports the hook symbols
        if: "!cancelled()"
        run: |
          set -euo pipefail
          SYMS=$(nm -D --defined-only "$DENO_SQLITE_PATH")
          for s in sqlite3_update_hook sqlite3_commit_hook sqlite3_rollback_hook \
                   sqlite3_wal_hook sqlite3_trace_v2 sqlite3_progress_handler \
                   sqlite3_busy_handler sqlite3_preupdate_hook; do
            echo "$SYMS" | grep -q " $s\$" || { echo "::error::$DENO_SQLITE_PATH does not export $s"; exit 1; }
          done
          echo "all hook symbols present"

      - name: deno fmt --check
        if: "!cancelled()"
        run: deno fmt --check

      - name: deno lint
        if: "!cancelled()"
        run: deno lint

      - name: deno check
        if: "!cancelled()"
        run: deno check

      # Proves, before any suite runs, that the driver can open the library
      # pinned above and execute against it. If this passes and a later suite
      # still segfaults, the bug is ours; if this fails, the environment is
      # wrong, and it says so here rather than as an obscure suite failure.
      #
      # It does NOT compare two independent readings, and is not named as
      # though it does. The step this replaced claimed to prove the driver and
      # our FFI had loaded the same SQLite, by reading the version through
      # each and comparing. That was meaningful while the driver was a
      # third-party package that resolved a library of its own; once the
      # driver was vendored, both halves came to read the same environment
      # variable, and the comparison became one that cannot fail. Measured
      # rather than assumed: with two different libraries on disk, 3.45.1 and
      # 3.53.4, the old script was run under DENO_SQLITE_PATH pinned at each
      # in turn and reported agreement both times — 3.45.1 on both sides, then
      # 3.53.4 on both sides. The only way it could still go red was the FFI
      # half failing to dlopen at all, which is not what it claimed to prove.
      #
      # For the same reason the script below does not assert that the path the
      # driver reports equals the pinned one: the driver's `libraryPath` IS
      # DENO_SQLITE_PATH when the variable is set, so that comparison is the
      # same string read twice. It is printed as a record, not asserted.
      #
      # What IS asserted can go red. The variable being unset fails the first
      # line, which is what a "Pin DENO_SQLITE_PATH" step that did not
      # propagate through GITHUB_ENV looks like. Importing the driver dlopens
      # the pinned file and binds every symbol the driver needs, so a file
      # that is not a libsqlite3, or one missing a symbol, throws there —
      # both seen red before this step was trusted. Executing a statement
      # covers the rest.
      #
      # `-c` is still required even though the script imports the driver by
      # PATH and no longer by a bare specifier: driver/database.ts imports
      # `@std/path`, which is a bare specifier, and a script in $RUNNER_TEMP
      # resolves it only through the repository's import map. Dropping `-c`
      # was measured to fail here with `Import "@std/path" not a dependency`.
      - name: Driver opens the pinned library and executes against it
        if: "!cancelled()"
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/opens.ts" <<'TS'
          const pinned = Deno.env.get("DENO_SQLITE_PATH");
          if (!pinned) throw new Error("DENO_SQLITE_PATH is not set");
          const { Database, libraryPath } = await import(
            `${Deno.env.get("GITHUB_WORKSPACE")}/driver/mod.ts`
          );
          const db = new Database(":memory:");
          const row = db.prepare("select sqlite_version() as v").get();
          db.close();
          if (!row) {
            throw new Error("the driver opened the library but returned no row");
          }
          console.log(`driver opened ${libraryPath} and reports ${row.v}`);
          TS
          deno run -c "$GITHUB_WORKSPACE/deno.json" --unstable-ffi --allow-ffi --allow-env --allow-read --allow-write "$RUNNER_TEMP/opens.ts"

      - name: Tests
        if: "!cancelled()"
        run: deno task test

      # Runs each crash case in its own child process and asserts on the exit
      # code, so a real segfault (139) cannot be reported as a pass.
      - name: Crash matrix
        if: "!cancelled()"
        run: deno task test:crash

      # What actually ships. Asserts on the file list deno publish reports,
      # not on the exclude patterns, so a rule that catches LICENSE or NOTICE
      # by accident fails here rather than in a published package.
      - name: Publish manifest
        if: "!cancelled()"
        run: deno task test:publish
