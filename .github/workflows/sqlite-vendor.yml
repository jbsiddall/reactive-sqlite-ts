# Build and VALIDATE the vendored SQLite for every architecture we ship.
#
# Read-only, like ci.yml and for the same reason: it cannot publish because it
# was never given the permission, so it needs no guards. The publishing twin is
# sqlite-vendor-release.yml.
#
# The build itself is NOT defined here. Both this workflow and the release twin
# call sqlite-vendor-build.yml, so a green run here is evidence about the same
# steps, the same runners and the same asset names a tag push would use. Read
# that file for the matrix, the naming contract and why it is a reusable
# workflow rather than a composite action.
#
# WHY THIS EXISTS AT ALL
# ----------------------
# vendor/lib/ is gitignored (see that directory's README, "Committing the
# binaries"). Nothing keeps the build script working except a job that runs it,
# so this one runs it on both target architectures -- each on its own native
# runner -- and proves each result actually executes.
#
# It deliberately does NOT need Deno for the build: build.sh and smoke_test.sh
# are bash + cc. Deno appears only for the probe and the SESSION demo below,
# which stay x86_64-only: they are capability checks on the build recipe, not
# on the machine, and the flags they probe are compiled in from the same
# FLAGS list on both runners.
name: sqlite-vendor

on:
  # ci.yml runs on direct pushes to main; without the same trigger here, a
  # direct push would be the one path past review that runs no vendor build
  # at all. The paths filter keeps the trigger to the files the build is
  # made of, so an ordinary docs push to main buys nothing.
  push:
    branches: [main]
    paths:
      - "vendor/**"
      - ".github/workflows/sqlite-vendor.yml"
      - ".github/workflows/sqlite-vendor-build.yml"
      - ".github/workflows/sqlite-vendor-release.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "vendor/**"
      # Every file the build is now made of. The factoring moved most of this
      # workflow's substance into a sibling file and a script directory; a
      # filter still naming only this file would have stopped watching the
      # parts that matter most.
      - ".github/workflows/sqlite-vendor.yml"
      - ".github/workflows/sqlite-vendor-build.yml"
      - ".github/workflows/sqlite-vendor-release.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlite-vendor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build, validate, package and checksum -- byte-for-byte the same definition
  # the release runs. Everything except the upload.
  build:
    uses: ./.github/workflows/sqlite-vendor-build.yml

  # Capability checks that need Deno, and therefore do not belong in the shared
  # build (the release path has never run them and does not need to: they
  # interrogate the compile-flag set, which is the same on both runners).
  capabilities:
    name: capability probe (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build x86_64
        run: vendor/build.sh --keep-src

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          # Same pin as ci.yml.
          deno-version: "2.8.2"

      - name: Capability probe (x86_64)
        run: deno task vendor:probe

      - name: SESSION extension end-to-end (x86_64)
        run: deno task vendor:session-demo
