# Publish the vendored SQLite libraries as GitHub Release assets.
#
# Separate from sqlite-vendor.yml because this one can write to the repository,
# and the rule is that a workflow which can publish never runs on unreviewed
# code. It runs only on a tag a human pushed. There is deliberately no
# workflow_dispatch and no other trigger here; adding one would end that
# guarantee, and the request has been refused before.
#
#   git tag sqlite-vendor-v3.53.4 && git push origin sqlite-vendor-v3.53.4
#
# The build is NOT defined here. It is sqlite-vendor-build.yml, the same file
# the read-only sibling calls, so the sibling's green run is evidence about the
# steps, the runners and the asset names this workflow will use. Only the
# `publish` job below is unique to this file, and it is the only job holding
# `contents: write`.
#
# WHAT IS AND IS NOT ASYMMETRIC BETWEEN THE TWO WORKFLOWS
# -------------------------------------------------------
# It used to be the build: x86_64 ran natively and aarch64 was cross-compiled
# and executed under qemu-user. That is over -- both architectures now build
# and run on their own native hardware (see sqlite-vendor-build.yml). What
# remains asymmetric is the PUBLISH: the shared workflow builds, validates,
# packages and checksums on every pull request, and the one step no sibling run
# has ever exercised is the upload below, because it needs a tag and a
# permission the sibling does not have. Every asset is still executed before it
# is uploaded; an artifact that has never run does not ship.
#
# WHY RELEASE ASSETS RATHER THAN COMMITTED BINARIES
# -------------------------------------------------
# Measured: the two .so files cost 1.60 MiB of git objects, and every rebuild
# adds another 1.60 MiB that history can never drop. @db/sqlite has the same
# problem and solves it the same way -- it publishes per-platform prebuilts as
# release assets and fetches them at runtime via @denosaurs/plug. That is
# working evidence from the library this project's driver was vendored from,
# not a preference.
name: sqlite-vendor-release

on:
  push:
    tags:
      - "sqlite-vendor-v*"

# Least privilege at the top; the single job that needs to write says so for
# itself. The shared build workflow additionally declares `contents: read` on
# its own account, so it cannot publish even from here.
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/sqlite-vendor-build.yml

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Exactly what the shared workflow asserted and checksummed. Nothing is
      # rebuilt, repackaged or re-checksummed here: if this job could produce
      # an asset, the sibling's run would stop being evidence about it.
      - name: Download the asset set the shared build produced
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: out

      - name: Show what is about to be published
        run: |
          set -euo pipefail
          ls -l out
          echo "--- SHA256SUMS ---"
          cat out/SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true
          body: |
            Vendored SQLite shared libraries, built from the pinned amalgamation
            by `vendor/build.sh` and validated by `smoke_test.sh` before upload.
            Both architectures are built and executed on native runners; nothing
            here is cross-compiled or emulated.

            **Assets, per target.** `<target>` is the triple `vendor/build.sh`
            names its output directory with — `"${OS}-${ARCH}-${LIBC}"` — which
            is what `src/vendored.ts` computes from `Deno.build.{os,arch}`:

            | target | tarball | bare library |
            | --- | --- | --- |
            | `linux-x86_64-gnu` | `libsqlite3-linux-x86_64-gnu.tar.gz` | `libsqlite3-linux-x86_64-gnu.so` |
            | `linux-aarch64-gnu` | `libsqlite3-linux-aarch64-gnu.tar.gz` | `libsqlite3-linux-aarch64-gnu.so` |

            **The documented install fetches the bare `libsqlite3-<target>.so`.**
            `Deno.dlopen` takes a path to a shared object and cannot be handed a
            `.tar.gz`. Take the tarball instead when you want the
            `build_manifest.json` beside it — the exact SQLite version, the full
            compile-flag list and the source checksums the library was built
            from.

            Both runners are glibc, so every asset here is `-gnu`. **There is no
            musl build**; substituting `musl` into the names above resolves to
            nothing.

            Every asset URL is a pure function of the tag and the target:

            ```
            https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/libsqlite3-<target>.so
            ```

            `SHA256SUMS` covers every tarball and every bare library, under
            those plain names, so `sha256sum -c SHA256SUMS` works wherever you
            downloaded them. It is served from this same release and is not
            signed: it will catch a corrupted download, and it is not evidence
            of provenance.
